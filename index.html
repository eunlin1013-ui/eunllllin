<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>응가임의 나고야 혼여 ❄️</title>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Leaflet OpenStreetMap (무료 지도 라이브러리) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --sky: #eaf5ff;
            --sky-deep: #c9e7ff;
            --pink: #f5a8bd;
            --pink-deep: #e985a5;
            --pink-light: #fff0f5;
            --cream: #fffaf6;
            --white: #ffffff;
            --ink: #574854;
            --muted: #a18d9a;
            --border: #f4dce6;
            --shadow: 0 8px 28px rgba(132, 133, 174, 0.10);
            --round: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Gowun Dodum', sans-serif;
        }

        body {
            background:
                radial-gradient(ellipse at 5% 15%, #ffffff 0%, transparent 30%),
                linear-gradient(180deg, #e8f5ff 0%, #f7f5ff 48%, #fff5f8 100%);
            color: var(--ink);
            min-height: 100vh;
            padding-bottom: 3rem;
        }

        /* 겨울 여행 다이어리 헤더 */
        header {
            position: relative;
            overflow: hidden;
            padding: 3.4rem 1.2rem 2.5rem;
            text-align: center;
            border-radius: 0 0 38px 38px;
            background:
                linear-gradient(
                    180deg,
                    rgba(223, 242, 255, 0.38),
                    rgba(255, 240, 246, 0.92)
                ),
                url('https://images.unsplash.com/photo-1590559899731-a382839e5549?auto=format&fit=crop&w=1400&q=85')
                center 48% / cover no-repeat;
            border-bottom: 1px solid rgba(255,255,255,.9);
            box-shadow: 0 10px 30px rgba(119, 157, 190, .13);
        }

        header::before {
            content: "✦  ❄  ♡  ✧";
            position: absolute;
            top: 16px;
            right: 22px;
            color: white;
            font-size: 1.2rem;
            letter-spacing: 7px;
            text-shadow: 0 1px 8px rgba(100, 125, 160, .2);
        }

        header h1 {
            position: relative;
            font-family: 'Jua', sans-serif;
            font-size: clamp(1.8rem, 5vw, 2.7rem);
            line-height: 1.4;
            color: #594b65;
            text-shadow: 0 2px 0 white, 0 4px 16px rgba(255,255,255,.8);
        }

        .header-subtitle {
            margin-top: .55rem;
            color: #71647d;
            font-size: .95rem;
            font-weight: bold;
            line-height: 1.7;
        }

        .dates-chip {
            display: inline-block;
            margin-top: 1.1rem;
            padding: .65rem 1.15rem;
            border: 1px solid rgba(255,255,255,.95);
            border-radius: 30px;
            background: rgba(255,255,255,.83);
            color: #d66f91;
            font-size: .86rem;
            font-weight: bold;
            box-shadow: 0 5px 18px rgba(150, 120, 150, .1);
            backdrop-filter: blur(8px);
        }

        /* 날짜 탭 */
        .day-tabs {
            display: flex;
            gap: .6rem;
            padding: 1.5rem 1rem 1.1rem;
            overflow-x: auto;
            max-width: 1100px;
            margin: 0 auto;
            scrollbar-width: none;
        }

        .day-tabs::-webkit-scrollbar {
            display: none;
        }

        .day-tab {
            flex: 0 0 auto;
            padding: .75rem 1.1rem;
            border: 1px solid #d7e9fa;
            border-radius: 18px;
            background: rgba(255,255,255,.8);
            color: #7895b5;
            font-family: 'Jua', sans-serif;
            font-size: .95rem;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s, background .2s;
        }

        .day-tab:hover {
            transform: translateY(-2px);
        }

        .day-tab.active {
            background: linear-gradient(135deg, #f6b6ca, #ed91b0);
            border-color: transparent;
            color: white;
            box-shadow: 0 6px 15px rgba(226, 137, 170, .25);
        }

        /* 페이지 레이아웃 */
        .main-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            align-items: start;
            gap: 1.25rem;
            padding: 0 1.2rem;
            max-width: 1180px;
            margin: 0 auto;
        }

        .main-layout > div {
            min-width: 0;
        }

        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: minmax(0, 1fr);
                padding: 0 .85rem;
                gap: .25rem;
            }

            header {
                padding-top: 3rem;
            }

            .day-tabs {
                padding-top: 1.1rem;
            }

            #map-container {
                height: 330px !important;
            }
        }

        /* 카드 */
        .card {
            padding: 1.25rem;
            margin-bottom: 1.15rem;
            border: 1px solid rgba(255,255,255,.95);
            border-radius: var(--round);
            background: rgba(255, 250, 250, .93);
            box-shadow: var(--shadow);
        }

        .card-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .45rem;
            margin-bottom: 1rem;
            color: #b76f91;
            font-family: 'Jua', sans-serif;
            font-size: 1.22rem;
            line-height: 1.5;
        }

        .card-title::first-letter {
            color: var(--pink-deep);
        }

        /* 전체 총지출 배너 */
        .total-budget-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .8rem;
            padding: 1.2rem 1.25rem;
            margin-bottom: 1.15rem;
            border: 1px solid rgba(255,255,255,.75);
            border-radius: 23px;
            background: linear-gradient(135deg, #f5abc2 0%, #f8c5d4 52%, #f8d9e6 100%);
            color: white;
            box-shadow: 0 9px 23px rgba(220, 137, 170, .2);
        }

        .total-budget-banner span {
            font-weight: bold;
            line-height: 1.7;
        }

        .total-budget-banner p {
            line-height: 1.7;
        }

        .budget-info h3 {
            color: white;
            font-family: 'Jua', sans-serif;
            font-size: clamp(1.35rem, 4vw, 1.8rem);
        }

        .budget-info p {
            color: #fff9fc;
            font-size: .82rem;
        }

        #exchange-rate-status {
            margin-top: .35rem;
            color: #fff9fc;
            font-size: .7rem;
            line-height: 1.5;
        }

        /* 검색 모드 */
        .input-mode-toggle {
            display: flex;
            gap: .55rem;
            margin-bottom: 1rem;
        }

        .toggle-btn {
            flex: 1;
            min-width: 0;
            padding: .7rem .45rem;
            border: 1px solid #f0d7e2;
            border-radius: 14px;
            background: white;
            color: #9b7c90;
            font-size: .82rem;
            font-weight: bold;
            line-height: 1.5;
            cursor: pointer;
            transition: .2s;
        }

        .toggle-btn.active {
            background: #fff0f5;
            color: #c5688b;
            border-color: #edb2c8;
            box-shadow: inset 0 0 0 1px #f8dbe6;
        }

        .form-group {
            min-width: 0;
            margin-bottom: .9rem;
        }

        .form-group label {
            display: block;
            margin-bottom: .4rem;
            color: #927083;
            font-size: .84rem;
            font-weight: bold;
        }

        input, select, textarea {
            display: block;
            width: 100%;
            min-width: 0;
            padding: .78rem .85rem;
            border: 1px solid #eedce5;
            border-radius: 13px;
            outline: none;
            background: #fff;
            color: var(--ink);
            font-size: .9rem;
            transition: border-color .2s, box-shadow .2s;
        }

        input::placeholder,
        textarea::placeholder {
            color: #c3b5c0;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #e9a2bd;
            box-shadow: 0 0 0 3px rgba(233, 162, 189, .15);
        }

        /* 추가 버튼 */
        .btn-add {
            width: 100%;
            padding: .9rem 1rem;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #f4a9c0, #e98eae);
            color: white;
            font-family: 'Jua', sans-serif;
            font-size: 1.08rem;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(226, 137, 170, .22);
            transition: transform .15s, box-shadow .15s;
        }

        .btn-add:hover {
            box-shadow: 0 8px 18px rgba(226, 137, 170, .3);
        }

        .btn-add:active {
            transform: scale(.985);
        }

        /* 초기화 버튼 */
        .btn-reset {
            padding: .35rem .75rem;
            border: 1px solid #f0d7e2;
            border-radius: 12px;
            background: #fff0f5;
            color: #c5688b;
            font-size: .78rem;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        .btn-reset:hover {
            background: #e985a5;
            color: white;
            border-color: transparent;
        }

        /* 장소 카드 */
        .place-card {
            margin-bottom: .9rem;
            padding: 1rem;
            border: 1px solid #f0dfe7;
            border-radius: 19px;
            background: #fff;
            box-shadow: 0 4px 14px rgba(130, 105, 130, .055);
            transition: border-color .2s, transform .2s;
        }

        .place-card:hover {
            border-color: #eec1d2;
        }

        .place-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .6rem;
        }

        .place-title-text {
            min-width: 0;
            overflow-wrap: anywhere;
            color: #93627c;
            font-family: 'Jua', sans-serif;
            font-size: 1.08rem;
            line-height: 1.6;
            cursor: pointer;
        }

        .order-btns {
            display: flex;
            flex: 0 0 auto;
            gap: .3rem;
        }

        .btn-order {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 31px;
            height: 31px;
            border: 1px solid #f4dce6;
            border-radius: 11px;
            background: #fff2f6;
            color: #b87591;
            font-size: .78rem;
            cursor: pointer;
            transition: .15s;
        }

        .btn-order:hover {
            background: #f8dbe6;
            transform: translateY(-1px);
        }

        .place-details {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: .65rem;
            margin-top: .9rem;
            padding-top: .95rem;
            border-top: 1px dashed #f0dce5;
        }

        .place-details .form-group {
            margin-bottom: .15rem;
        }

        .place-details .form-group[style*="span 2"] {
            grid-column: 1 / -1;
        }

        .place-details input,
        .place-details select {
            padding: .68rem .65rem;
            font-size: .84rem;
        }

        .place-details span {
            display: block;
            margin-top: .35rem;
            color: #b08da0 !important;
            font-size: .76rem !important;
            line-height: 1.5;
        }

        /* 지도 */
        #map-container {
            width: 100%;
            height: 420px;
            overflow: hidden;
            border: 3px solid white;
            border-radius: 20px;
            background: #e8f5ff;
            box-shadow: 0 5px 20px rgba(125, 155, 185, .1);
            z-index: 1;
        }

        /* 지도 마커 번호 아이콘 스타일 */
        .custom-number-marker {
            background: linear-gradient(135deg, #e985a5, #f5a8bd);
            color: white;
            font-family: 'Jua', sans-serif;
            font-weight: bold;
            font-size: 14px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            display: flex !important;
            align-items: center;
            justify-content: center;
        }

        .card:has(#map-container) {
            padding: 1rem;
        }

        @media (min-width: 769px) {
            .card:has(#map-container) {
                position: sticky;
                top: 1rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>🏯 응가임의 나고야 혼여 ❄️</h1>
        <div class="header-subtitle">나만의 감성 여행 다이어리</div>
        <div class="dates-chip">🗓️ 2026.12.14(월) ~ 12.18(금) [4박 5일]</div>
    </header>

    <!-- 날짜 선택 탭 -->
    <div class="day-tabs">
        <button class="day-tab active" onclick="selectDay(1)">Day 1 (12/14)</button>
        <button class="day-tab" onclick="selectDay(2)">Day 2 (12/15)</button>
        <button class="day-tab" onclick="selectDay(3)">Day 3 (12/16)</button>
        <button class="day-tab" onclick="selectDay(4)">Day 4 (12/17)</button>
        <button class="day-tab" onclick="selectDay(5)">Day 5 (12/18)</button>
    </div>

    <div class="main-layout">
        <!-- 왼쪽: 전체 지출 + 일정 목록 -->
        <div>
            <div class="total-budget-banner">
                <div>
                    <span>💰 전체 총지출</span>
                    <p style="font-size:0.75rem; opacity:0.9;">5일 전체 일정의 예상 비용</p>
                    <p id="exchange-rate-status">실시간 환율 불러오는 중...</p>
                </div>
                <div class="budget-info" style="text-align: right;">
                    <h3 id="total-price">¥0</h3>
                    <p id="total-krw">(약 0원)</p>
                </div>
            </div>

            <!-- 일정 목록 -->
            <div class="card">
                <div class="card-title">
                    <span>📍 Day <span id="current-day-title">1</span> 일정 및 세부 설정</span>
                    <button class="btn-reset" onclick="resetToDefaultData()">🔄 기본 데이터 초기화</button>
                </div>
                <div id="place-list-container"></div>
            </div>
        </div>

        <!-- 오른쪽: 지도 -->
        <div>
            <div class="card">
                <div class="card-title">🗺️ 동선 연결 지도</div>
                <div id="map-container"></div>
            </div>
        </div>
    </div>

    <!-- 장소 추가 카드 -->
    <div style="max-width:1180px; margin:0 auto; padding:0 1.2rem;">
        <div class="card">
            <div class="card-title">✨ Day <span id="current-day-num">1</span> 장소 간편 추가</div>

            <div class="input-mode-toggle">
                <button class="toggle-btn active" id="btn-search-mode" onclick="setMode('search')">🔍 장소 이름/명칭 검색</button>
                <button class="toggle-btn" id="btn-gps-mode" onclick="setMode('gps')">📍 직접 GPS 위치 입력</button>
            </div>

            <div id="search-input-box" class="form-group">
                <label>장소 키워드 검색</label>
                <input type="text" id="place-search-kw" placeholder="예: 지브리 파크, 나고야성, 오아시스 21, Nagoya Station" onkeypress="if(event.key==='Enter') addNewPlace()">
            </div>

            <div id="gps-input-box" class="form-group" style="display:none;">
                <label>장소 이름 및 좌표</label>
                <input type="text" id="custom-name" placeholder="예: 나만의 비밀 카페" style="margin-bottom:0.5rem;">
                <div style="display:flex; gap:0.5rem;">
                    <input type="number" step="any" id="custom-lat" placeholder="위도 (Lat): 35.1848">
                    <input type="number" step="any" id="custom-lng" placeholder="경도 (Lng): 136.8997">
                </div>
            </div>

            <button class="btn-add" id="btn-add-submit" onclick="addNewPlace()">➕ 장소 추가하기</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "nagoya_travel_trip_data_v1";
        const DEFAULT_JPY_TO_KRW_RATE = 9;
        let JPY_TO_KRW_RATE = DEFAULT_JPY_TO_KRW_RATE;
        let currentDay = 1;
        let inputMode = 'search';
        let map = null;
        let polyline = null;
        let markers = [];

        const initialDefaultData = {
            1: [
                { id: 101, name: "나고야성", lat: 35.1848, lng: 136.8997, day: 1, cost: 500, category: "기타", hours: "09:00 - 16:30", memo: "천수각 전경 확인 및 산책" },
                { id: 102, name: "오아시스 21", lat: 35.1709, lng: 136.9082, day: 1, cost: 0, category: "기타", hours: "10:00 - 21:00", memo: "야경 촬영 명소" }
            ],
            2: [], 3: [], 4: [], 5: []
        };

        let tripData = loadSavedTripData();

        function loadSavedTripData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && typeof parsed === 'object') return parsed;
                }
            } catch (e) {
                console.error("저장 데이터 로드 실패:", e);
            }
            return JSON.parse(JSON.stringify(initialDefaultData));
        }

        function saveTripData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tripData));
            } catch (e) {
                console.error("데이터 저장 실패:", e);
            }
        }

        function resetToDefaultData() {
            if (confirm("기본 일정 데이터로 초기화할까요? 추가한 장소나 수정사항이 지워집니다.")) {
                tripData = JSON.parse(JSON.stringify(initialDefaultData));
                saveTripData();
                renderSchedule();
                updateTotalSpending();
            }
        }

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, function (char) {
                return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char];
            });
        }

        async function loadExchangeRate() {
            const status = document.getElementById("exchange-rate-status");
            try {
                const response = await fetch("https://open.er-api.com/v6/latest/JPY");
                if (!response.ok) throw new Error("환율 로드 실패");
                const data = await response.json();
                const rate = Number(data?.rates?.KRW);
                if (!Number.isFinite(rate) || rate <= 0) throw new Error("환율 오류");

                JPY_TO_KRW_RATE = rate;
                status.textContent = "실시간 환율 · 100엔 ≈ " + Math.round(rate * 100).toLocaleString("ko-KR") + "원";
            } catch (error) {
                JPY_TO_KRW_RATE = DEFAULT_JPY_TO_KRW_RATE;
                status.textContent = "환율 연결 실패 · 기본 환율 100엔 = 900원";
            }
            renderSchedule();
            updateTotalSpending();
        }

        function updateTotalSpending() {
            let total = 0;
            Object.values(tripData).forEach(function (places) {
                places.forEach(function (place) {
                    total += Math.max(0, Number(place.cost) || 0);
                });
            });
            document.getElementById("total-price").innerText = "¥" + total.toLocaleString("ja-JP");
            document.getElementById("total-krw").innerText = "(약 " + Math.round(total * JPY_TO_KRW_RATE).toLocaleString("ko-KR") + "원)";
        }

        function initMap() {
            map = L.map('map-container').setView([35.1848, 136.8997], 13);
            
            // Google Maps 무료 한국어 레이어 적용
            L.tileLayer('https://mt1.google.com/vt/lyrs=m&hl=ko&x={x}&y={y}&z={z}', {
                maxZoom: 19,
                attribution: '© Google Maps'
            }).addTo(map);

            polyline = L.polyline([], { color: '#e985a5', weight: 4, opacity: 0.85 }).addTo(map);
            renderSchedule();
        }

        function setMode(mode) {
            inputMode = mode;
            document.getElementById('btn-search-mode').classList.toggle('active', mode === 'search');
            document.getElementById('btn-gps-mode').classList.toggle('active', mode === 'gps');
            document.getElementById('search-input-box').style.display = mode === 'search' ? 'block' : 'none';
            document.getElementById('gps-input-box').style.display = mode === 'gps' ? 'block' : 'none';
        }

        function selectDay(day) {
            currentDay = day;
            document.querySelectorAll('.day-tab').forEach(function (tab, idx) {
                tab.classList.toggle('active', idx + 1 === day);
            });
            document.getElementById('current-day-num').innerText = day;
            document.getElementById('current-day-title').innerText = day;
            renderSchedule();
        }

        async function addNewPlace() {
            let name, lat, lng;
            const btnAdd = document.getElementById('btn-add-submit');

            if (inputMode === 'search') {
                const kw = document.getElementById('place-search-kw').value.trim();
                if (!kw) return alert("검색할 장소 이름을 입력해주세요!");

                btnAdd.innerText = "🔍 위치 검색 중...";
                btnAdd.disabled = true;

                try {
                    const searchUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(kw + " Japan")}&limit=1`;
                    const res = await fetch(searchUrl);
                    const results = await res.json();

                    if (!results || results.length === 0) {
                        const resGlobal = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(kw)}&limit=1`);
                        const resultsGlobal = await resGlobal.json();
                        
                        if (!resultsGlobal || resultsGlobal.length === 0) {
                            alert("장소를 찾을 수 없습니다. 영문이나 한자 이름으로 검색해보세요.");
                            return;
                        }
                        lat = parseFloat(resultsGlobal[0].lat);
                        lng = parseFloat(resultsGlobal[0].lon);
                    } else {
                        lat = parseFloat(results[0].lat);
                        lng = parseFloat(results[0].lon);
                    }
                    name = kw;
                } catch (e) {
                    alert("검색 중 오류가 발생했습니다.");
                    return;
                } finally {
                    btnAdd.innerText = "➕ 장소 추가하기";
                    btnAdd.disabled = false;
                }
            } else {
                name = document.getElementById('custom-name').value.trim();
                lat = parseFloat(document.getElementById('custom-lat').value);
                lng = parseFloat(document.getElementById('custom-lng').value);

                if (!name || !Number.isFinite(lat) || !Number.isFinite(lng)) {
                    return alert("장소명과 GPS 위도/경도를 올바르게 입력해주세요.");
                }
            }

            const newPlace = {
                id: Date.now(),
                name: name,
                lat: lat,
                lng: lng,
                day: currentDay,
                cost: 0,
                category: "기타",
                hours: "",
                memo: ""
            };

            if (!tripData[currentDay]) tripData[currentDay] = [];
            tripData[currentDay].push(newPlace);
            saveTripData();

            document.getElementById('place-search-kw').value = '';
            document.getElementById('custom-name').value = '';
            document.getElementById('custom-lat').value = '';
            document.getElementById('custom-lng').value = '';

            renderSchedule();
            updateTotalSpending();
        }

        function movePlace(index, direction) {
            const list = tripData[currentDay];
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= list.length) return;

            const temp = list[index];
            list[index] = list[targetIndex];
            list[targetIndex] = temp;

            saveTripData();
            renderSchedule();
        }

        function updatePlaceDetails(id, field, value) {
            const place = tripData[currentDay].find(p => p.id === id);
            if (!place) return;

            if (field === 'day') {
                const targetDay = parseInt(value, 10);
                if (targetDay !== currentDay) {
                    tripData[currentDay] = tripData[currentDay].filter(p => p.id !== id);
                    place.day = targetDay;
                    if (!tripData[targetDay]) tripData[targetDay] = [];
                    tripData[targetDay].push(place);

                    saveTripData();
                    selectDay(targetDay);
                    updateTotalSpending();
                    return;
                }
            } else if (field === 'cost') {
                place.cost = Math.max(0, parseFloat(value) || 0);
            } else {
                place[field] = value;
            }

            saveTripData();
            renderSchedule();
            updateTotalSpending();
        }

        function deletePlace(id) {
            const place = tripData[currentDay].find(p => p.id === id);
            if (!place) return;
            if (!confirm('"' + place.name + '" 장소를 삭제할까요?')) return;

            tripData[currentDay] = tripData[currentDay].filter(p => p.id !== id);
            saveTripData();
            renderSchedule();
            updateTotalSpending();
        }

        function focusPlace(id) {
            const place = tripData[currentDay].find(p => p.id === id);
            if (!place || !map) return;
            map.setView([place.lat, place.lng], 16);
        }

        function renderSchedule() {
            const container = document.getElementById('place-list-container');
            container.innerHTML = '';

            const dayList = tripData[currentDay] || [];
            const pathCoordinates = [];

            markers.forEach(m => map.removeLayer(m));
            markers = [];

            if (dayList.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#a18d9a; padding:2rem;">등록된 장소가 없습니다. 아래에서 장소를 추가해보세요! ❄️</div>';
            }

            dayList.forEach((place, index) => {
                const krwEquivalent = Math.round((Number(place.cost) || 0) * JPY_TO_KRW_RATE);
                const pos = [Number(place.lat), Number(place.lng)];
                pathCoordinates.push(pos);

                if (map) {
                    const numberIcon = L.divIcon({
                        className: 'custom-number-marker',
                        html: `${index + 1}`,
                        iconSize: [28, 28],
                        iconAnchor: [14, 14]
                    });

                    const marker = L.marker(pos, { icon: numberIcon }).addTo(map)
                        .bindPopup(`<b>${index + 1}. ${escapeHTML(place.name)}</b><br>${escapeHTML(place.hours || "시간 미정")}`);
                    markers.push(marker);
                }

                const card = document.createElement('div');
                card.className = 'place-card';
                card.innerHTML = `
                    <div class="place-header">
                        <span class="place-title-text" onclick="focusPlace(${place.id})">${index + 1}. ${escapeHTML(place.name)} 📍</span>
                        <div class="order-btns">
                            <button class="btn-order" onclick="movePlace(${index}, -1)" aria-label="위로">▲</button>
                            <button class="btn-order" onclick="movePlace(${index}, 1)" aria-label="아래로">▼</button>
                            <button class="btn-order" style="background:#fff0f5;color:#e985a5;border-color:#f4dce6;" onclick="deletePlace(${place.id})" aria-label="삭제">✕</button>
                        </div>
                    </div>
                    <div class="place-details">
                        <div class="form-group">
                            <label>📅 날짜 이동</label>
                            <select onchange="updatePlaceDetails(${place.id}, 'day', this.value)">
                                <option value="1" ${currentDay === 1 ? 'selected' : ''}>Day 1 (12/14)</option>
                                <option value="2" ${currentDay === 2 ? 'selected' : ''}>Day 2 (12/15)</option>
                                <option value="3" ${currentDay === 3 ? 'selected' : ''}>Day 3 (12/16)</option>
                                <option value="4" ${currentDay === 4 ? 'selected' : ''}>Day 4 (12/17)</option>
                                <option value="5" ${currentDay === 5 ? 'selected' : ''}>Day 5 (12/18)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>💴 지출 엔화(¥)</label>
                            <input type="number" min="0" step="1" value="${Number(place.cost) || 0}" onchange="updatePlaceDetails(${place.id}, 'cost', this.value)">
                            <span>자동 환산: 약 ${krwEquivalent.toLocaleString("ko-KR")}원</span>
                        </div>
                        <div class="form-group">
                            <label>⏰ 이용시간</label>
                            <input type="text" value="${escapeHTML(place.hours || '')}" placeholder="예: 10:00 - 12:00" onchange="updatePlaceDetails(${place.id}, 'hours', this.value)">
                        </div>
                        <div class="form-group">
                            <label>🏷️ 카테고리</label>
                            <select onchange="updatePlaceDetails(${place.id}, 'category', this.value)">
                                <option value="음식" ${place.category === '음식' ? 'selected' : ''}>🍽️ 음식</option>
                                <option value="쇼핑" ${place.category === '쇼핑' ? 'selected' : ''}>🛍️ 쇼핑</option>
                                <option value="교통" ${place.category === '교통' ? 'selected' : ''}>🚃 교통</option>
                                <option value="편의점" ${place.category === '편의점' ? 'selected' : ''}>🏪 편의점</option>
                                <option value="기타" ${place.category === '기타' ? 'selected' : ''}>✨ 기타/관광</option>
                            </select>
                        </div>
                        <div class="form-group" style="grid-column:span 2;">
                            <label>📝 메모</label>
                            <input type="text" value="${escapeHTML(place.memo || '')}" placeholder="특이사항 입력" onchange="updatePlaceDetails(${place.id}, 'memo', this.value)">
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            if (map && polyline) {
                polyline.setLatLngs(pathCoordinates);
                if (pathCoordinates.length > 0) {
                    map.fitBounds(polyline.getBounds(), { padding: [30, 30] });
                } else {
                    map.setView([35.1848, 136.8997], 13);
                }
            }
            updateTotalSpending();
        }

        window.onload = function() {
            initMap();
            loadExchangeRate();
        };
    </script>
</body>
</html>
